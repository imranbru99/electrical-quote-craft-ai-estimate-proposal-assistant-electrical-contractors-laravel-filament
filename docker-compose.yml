services:
  app:
    build: .
    container_name: electricalquotecraft_app
    ports:
      - "8103:8000"
    environment:
      APP_NAME: ElectricalQuoteCraft
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8103
      APP_KEY: base64:+uppR9lGxta7KD23kRCA2MPrdmpLLqOEXQEaR4bHlpw=
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: electricalquotecraft
      DB_USERNAME: eqc
      DB_PASSWORD: secret
      CACHE_STORE: file
      QUEUE_CONNECTION: database
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SESSION_DRIVER: database
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./storage:/var/www/html/storage
    restart: unless-stopped

  mysql:
    image: mysql:8.4
    command: ['--character-set-server=utf8mb4','--collation-server=utf8mb4_unicode_ci']
    container_name: electricalquotecraft_mysql
    environment:
      MYSQL_DATABASE: electricalquotecraft
      MYSQL_USER: eqc
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    ports:
      - "33063:3306"
    volumes:
      - eqc_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-prootsecret"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: electricalquotecraft_redis
    ports:
      - "63793:6379"
    restart: unless-stopped

volumes:
  eqc_mysql: